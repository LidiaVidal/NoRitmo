<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="shortcut icon" href="../assets/img/favicon.ico" type="image/x-icon">
    <title>NoRitmo</title>
</head>
<body>
    <header class="section-header historico">
        <a href="../../index.html">
            <img src="../assets/img/logo.png" alt="">
        </a>
        <a href="../../index.html">Voltar para Hoje</a>
    </header>
    <main>
        <h1>Seu histórico</h1>
        <p>Acompanhe suas métricas com facilidade</p>

        <section class="historico">
            <header class="header-history-section">
                <span id="date"></span>
                <div class="score-historico">
                    <p class="score-number">0%</p>
                    <span class="score-status">Neutro</span>
                </div>
                <p>--</p>
            </header>
            <div class="historico-content">
                <p class="historico-refeicao">Café da manhã: <span class="status-refeicao">Foco</span></p>
                <p class="historico-anotacoes">Ovos com café</p>

                <p class="historico-refeicao">Almoço: <span class="status-refeicao">Foco</span></p>
                <p class="historico-anotacoes">Ovos com café</p>

                <p class="historico-refeicao">Lanche da tarde: <span class="status-refeicao">Equilibrio</span></p>

                <p class="historico-refeicao">Jantar: <span class="status-refeicao">Pular/Jejum</span></p>
                <p class="historico-anotacoes">Ovos com café</p>
            </div>
        </section>
    </main>
    <script type="module" src="../scripts/main.js"></script>
</body>
</html>
