<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="shortcut icon" href="../assets/img/favicon.ico" type="image/x-icon">
    <title>NoRitmo</title>
</head>
<body id="page-historico">
    <header class="section-header historico">
        <a href="../../index.html">
            <img src="../assets/img/logo.png" alt="">
        </a>
        <a href="../../index.html" class="btn-navegar-pagina">
            <img src="../assets/icon/icon-arrow-left.png" alt="">Voltar para Hoje</a>
    </header>
    <main class="container-do-historico">
        <h1 class="title-pagina">Seu histórico</h1>

        <section class="historico-dia" data-status="balanced">
            <header class="header-historico-section">
        
                <div class="header-left">
                    <span class="dateHistorico"></span> 
                    <img src="../assets/icon/icon-arrow-down.png" alt="Expandir detalhes" class="seta-acordeao">
                </div>
                <div class="header-right">
                    <div class="score-historico">
                        <p class="score-number">60%</p>
                        <span class="score-status">Equilíbrio</span>
                    </div>
                    
                </div>
                
            </header>
            <div class="historico-content escondido">
                <p class="historico-refeicao">Café da manhã: <span class="status-refeicao" data-status="focus">Foco</span></p>
                <p class="historico-anotacoes">Ovos com café</p>

                <p class="historico-refeicao">Almoço: <span class="status-refeicao" data-status="focus">Foco</span></p>
                <p class="historico-anotacoes">Ovos com café</p>

                <p class="historico-refeicao">Lanche da tarde: <span class="status-refeicao" data-status="balanced">Equilibrio</span></p>

                <p class="historico-refeicao">Jantar: <span class="status-refeicao" data-status="skip">Pular/Jejum</span></p>
                <p class="historico-anotacoes">Ovos com café</p>
            </div>
        </section>
    </main>
    <script type="module" src="../scripts/main.js"></script>
</body>
</html>
